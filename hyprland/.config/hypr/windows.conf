# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

windowrule = center, class:^(org.pulseaudio.pavucontrol)$
windowrule = float, class:^(org.pulseaudio.pavucontrol)$

windowrule = center, title:nmtui
windowrule = float, title:nmtui
windowrule = noblur, title:nmtui
windowrule = noborder, title:nmtui

# Float and center file pickers
windowrule = center, class:Xdg-desktop-portal-gtk, title:^(Open.*Files?|Save.*Files?|All.*Files?)
windowrule = float, class:Xdg-desktop-portal-gtk, title:^(Open.*Files?|Save.*Files?|All.*Files?)
windowrule = noblur, class:Xdg-desktop-portal-gtk, title:^(Open.*Files?|Save.*Files?|All.*Files?)
windowrule = noborder, class:Xdg-desktop-portal-gtk, title:^(Open.*Files?|Save.*Files?|All.*Files?)