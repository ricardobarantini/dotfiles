# Set programs that you use
$terminal = uwsm app -- ghostty
$menu = uwsm app -- walker
$browser = uwsm app -- brave --new-window
$passwordManager = uwsm app -- proton-pass

# Startup apps
bind = SUPER, Return, exec, $terminal
bind = SUPER, space, exec, $menu
bind = SUPER, B, exec, $browser
bind = SUPER, G, exec, $passwordManager
bind = SUPER, O, exec, uwsm app -- obsidian
bind = SUPER, E, exec, uwsm app -- nautilus --new-window

# Terminal Apps
bind = SUPER, N, exec, $terminal -e nvim
bind = SUPER SHIFT, D, exec, $terminal -e lazydocker

# Webapps
bind = SUPER ALT, C, exec, $browser --app="https://claude.ai"
bind = SUPER ALT, G, exec, $browser --app="https://chatgpt.com"
bind = SUPER ALT, P, exec, $browser --app="https://mail.proton.me"
bind = SUPER ALT, L, exec, $browser --app="https://lumo.proton.me"

# Scripts
bind = SUPER SHIFT, V, exec, ~/.local/bin/toggle_vpn.sh

bind = SUPER, Q, killactive,

# Session
bind = SUPER, L, exec, ~/.local/bin/menu system

# Tiling
bind = SUPER, V, togglefloating,
bind = SUPER, P, pseudo, # dwindle
bind = SUPER, J, togglesplit, # dwindle

# Move focus with mainMod + arrow keys
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# Tab between workspaces
bindd = SUPER, TAB, Next workspace, workspace, e+1
bindd = SUPER SHIFT, TAB, Previous workspace, workspace, e-1

# Swap active window with the one next to it with SUPER + SHIFT + arrow keys
bindd = SUPER SHIFT, left, Swap window to the left, swapwindow, l
bindd = SUPER SHIFT, right, Swap window to the right, swapwindow, r
bindd = SUPER SHIFT, up, Swap window up, swapwindow, u
bindd = SUPER SHIFT, down, Swap window down, swapwindow, d

# Example special workspace (scratchpad)
bind = SUPER, S, togglespecialworkspace, magic
bind = SUPER SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Resize active window
bind = SUPER, minus, resizeactive, -100 0
bind = SUPER, equal, resizeactive, 100 0
bind = SUPER SHIFT, minus, resizeactive, 0 -100
bind = SUPER SHIFT, equal, resizeactive, 0 100

# Laptop multimedia keys for volume and LCD brightness
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindel = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle

# Brightness
# bindel = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
# bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower

# Requires playerctl
bindl = , XF86AudioNext, exec, swayosd-client --playerctl next
bindl = , XF86AudioPause, exec, swayosd-client --playerctl play-pause
bindl = , XF86AudioPlay, exec, swayosd-client --playerctl play-pause
bindl = , XF86AudioPrev, exec, swayosd-client --playerctl previous

# Screenshots
bind = , PRINT, exec, ~/.local/bin/menu screenshots
bind = SHIFT, PRINT, exec, ~/.local/bin/menu screenrecord

# Calculator
bind = , XF86Calculator, exec, walker -m calc

# Waybar
bind = SUPER CTRL, W, exec, pkill waybar && uwsm app -- waybar
